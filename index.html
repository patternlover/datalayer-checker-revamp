<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataLayer Checker Revamp</title>
    <script src="scripts/popupboot.js"></script>
    <link rel="stylesheet" href="gstyle.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div id="target-bar" class="target">
          <span class="target-dot" aria-hidden="true"></span>
          <button id="target-host" class="target-host" type="button">Nessun sito in test</button>
          <button id="target-unpin" class="target-unpin is-hidden" type="button" title="Chiudi la sessione: smetti di testare e azzera gli eventi raccolti" aria-label="Chiudi la sessione">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <div class="header-actions">
          <span id="injector-chip" class="chip is-hidden" title="Stato GTM Injector">GTM Injector</span>
          <button id="settings-toggle" class="icon-btn" type="button" title="Impostazioni" aria-label="Impostazioni">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </button>
        </div>
      </header>

      <div id="target-pin-strip" class="pin-strip is-hidden">
        <button id="target-pin" class="pin-btn" type="button">Testa questa tab</button>
      </div>

      <nav class="toolbar">
        <div class="tabs" role="tablist">
          <button class="tab-btn active" type="button" data-view="events" role="tab" aria-selected="true">Eventi</button>
          <button class="tab-btn" type="button" data-view="hits" role="tab" aria-selected="false">Hit</button>
          <button class="tab-btn" type="button" data-view="uat" role="tab" aria-selected="false">UAT</button>
        </div>
        <div id="env-select" class="seg is-hidden" role="group" aria-label="Ambiente da visualizzare">
          <button type="button" class="seg-btn" data-env="top_frame" title="dataLayer della pagina (T)">Top <span class="seg-count is-hidden" data-frame="top">0</span></button>
          <button type="button" class="seg-btn" data-env="iframe" title="dataLayer dei Shopify Custom Pixel (P)">Pixel <span class="seg-count is-hidden" data-frame="pixel">0</span></button>
        </div>
      </nav>

      <main id="events-view" class="view split-view">
        <aside class="events-sidebar">
          <div class="search-wrap">
            <input id="events-search" class="search-input" type="search" placeholder="Cerca nome, valore o path" autocomplete="off" spellcheck="false" aria-label="Cerca per nome, valore o path" />
            <button id="search-clear" class="search-clear is-hidden" type="button" title="Pulisci ricerca" aria-label="Pulisci ricerca">✕</button>
          </div>
          <div id="events-list" class="events-list"></div>
        </aside>

        <div id="events-split" class="split" role="separator" tabindex="0" aria-label="Ridimensiona la lista eventi" title="Trascina per ridimensionare"></div>

        <section class="detail">
          <div class="detail-head">
            <div class="detail-title-wrap">
              <span id="detail-name" class="detail-name">Nessun evento</span>
              <span id="detail-time" class="detail-time"></span>
            </div>
            <span id="detail-index" class="detail-index is-hidden">–</span>
            <button id="copy-push" class="btn btn-quiet is-hidden" type="button" title="Copia nel formato per Google Sheets">Copia</button>
          </div>
          <div id="containers-strip" class="containers-strip is-hidden"></div>
          <div id="detail-body" class="detail-body">
            <div id="empty-state" class="empty-state"></div>
            <div id="detail-json" class="json is-hidden"></div>
          </div>
        </section>
      </main>

      <main id="hits-view" class="view split-view is-hidden">
        <aside class="events-sidebar">
          <div class="search-wrap">
            <input id="hits-search" class="search-input" type="search" placeholder="Cerca vendor, evento o valore" autocomplete="off" spellcheck="false" aria-label="Cerca fra le hit" />
            <span id="hits-count" class="search-count is-hidden" title="Hit mostrate">0</span>
            <button id="hits-search-clear" class="search-clear is-hidden" type="button" title="Pulisci ricerca" aria-label="Pulisci ricerca">✕</button>
          </div>
          <div id="vendor-chips" class="type-chips"></div>
          <div id="hits-list" class="events-list"></div>
        </aside>

        <div id="hits-split" class="split" role="separator" tabindex="0" aria-label="Ridimensiona la lista hit" title="Trascina per ridimensionare"></div>

        <section class="detail">
          <div class="detail-head">
            <div class="detail-title-wrap">
              <span id="hit-vendor" class="vendor-badge"></span>
              <span id="hit-name" class="detail-name">Nessuna hit</span>
              <span id="hit-meta" class="detail-time"></span>
            </div>
            <a id="hit-docs" class="btn btn-quiet is-hidden" target="_blank" rel="noreferrer" title="Documentazione dei parametri del vendor">Docs</a>
            <button id="hit-copy-curl" class="btn btn-quiet is-hidden" type="button" title="Copia il comando curl della richiesta">cURL</button>
          </div>
          <div id="hit-correlation" class="detail-hits is-hidden"></div>
          <div class="detail-body">
            <div id="hit-empty" class="empty-state"></div>
            <div id="hit-detail" class="is-hidden">
              <p id="hit-url" class="hit-url" role="button" tabindex="0" title="Clic per copiare l'URL"></p>
              <div id="hit-fields" class="hit-fields"></div>
            </div>
          </div>
        </section>
      </main>

      <main id="uat-view" class="view is-hidden">
        <div class="uat-scroll">
          <div class="uat-add">
            <label class="field-label" for="collect-input">Eventi da verificare</label>
            <div class="collect-input-row">
              <input id="collect-input" class="text-input" type="text" placeholder="Incolla la colonna DataLayer TO BE" autocomplete="off" spellcheck="false" />
              <button id="collect-add" class="btn btn-dark" type="button">Aggiungi</button>
            </div>
            <p id="collect-parsed" class="field-hint is-hidden"></p>
          </div>
          <div class="uat-progress">
            <p id="collect-summary" class="collect-summary"></p>
            <div class="progress" aria-hidden="true"><span id="collect-bar"></span></div>
          </div>
          <div id="collect-list" class="collect-list"></div>
        </div>
        <footer class="view-foot">
          <button id="collect-clear" class="btn btn-quiet danger" type="button">Azzera</button>
          <button id="collect-copy" class="btn btn-dark" type="button">Copia UAT</button>
        </footer>
      </main>

      <main id="settings-view" class="view is-hidden">
        <div class="settings-scroll">
          <section class="setting">
            <button class="setting-row" type="button" id="uimode-row" aria-expanded="false" aria-controls="uimode-body">
              <span class="setting-title">Apertura</span>
              <span class="setting-value" id="uimode-value">Popup</span>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
            </button>
            <div class="setting-body" id="uimode-body" hidden>
              <div class="radio-list">
                <label class="radio"><input type="radio" name="uimode" value="popup" /><span>Popup</span></label>
                <label class="radio" id="uimode-sidepanel"><input type="radio" name="uimode" value="sidepanel" /><span>Pannello laterale</span></label>
                <label class="radio"><input type="radio" name="uimode" value="tab" /><span>Nuova tab</span></label>
              </div>
              <p id="uimode-note" class="setting-note is-hidden"></p>
            </div>
          </section>

          <section class="setting">
            <div class="setting-row static">
              <span class="setting-title">GTM Injector</span>
              <label class="switch" title="Carica il container nella pagina">
                <input type="checkbox" id="injector-toggle" />
                <span class="slider"></span>
              </label>
              <button class="disclosure" type="button" id="injector-row" aria-expanded="false" aria-controls="injector-body" aria-label="Impostazioni avanzate del container">
                <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
              </button>
            </div>
            <div class="setting-body" id="injector-body" hidden>
              <div class="setting-line">
                <span>Container</span>
                <select id="injector-container" class="mini-select" aria-label="Container da iniettare"></select>
                <input id="injector-manual" class="mini-input is-hidden" type="text" inputmode="latin" autocomplete="off" spellcheck="false" placeholder="GTM-XXXX" aria-label="Container da iniettare a mano" />
              </div>
              <div class="setting-line">
                <span>Collega a Tag Assistant</span>
                <label class="switch" title="Il container iniettato si dichiara in debug">
                  <input type="checkbox" id="injector-ta" />
                  <span class="slider"></span>
                </label>
              </div>
            </div>
          </section>

          <section class="setting">
            <div class="setting-row static">
              <span class="setting-title">Rispecchia pixel sul Top</span>
              <label class="switch" title="Gli eventi del pixel arrivano nel dataLayer della pagina">
                <input type="checkbox" id="mirror-toggle" />
                <span class="slider"></span>
              </label>
              <button class="disclosure" type="button" id="mirror-row" aria-expanded="false" aria-controls="mirror-body" aria-label="Impostazioni del ponte">
                <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
              </button>
            </div>
            <div class="setting-body" id="mirror-body" hidden>
              <div class="setting-line">
                <span>Eventi</span>
                <select id="mirror-scope" class="mini-select" aria-label="Eventi da rispecchiare">
                  <option value="solo-checkout">Solo checkout e ordini</option>
                  <option value="sempre">Tutte le pagine</option>
                </select>
              </div>
            </div>
          </section>
        </div>
        <footer class="view-foot">
          <span id="app-version" class="app-version" title="Versione caricata in questo browser"></span>
        </footer>
      </main>

      <div id="toast" class="toast">Salvato</div>
    </div>
    <script type="module" src="ui/main.js"></script>
  </body>
</html>
